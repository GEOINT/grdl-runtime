[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grdl-runtime"
version = "0.1.1"
description = "GEOINT Rapid Development Library Runtime — headless execution engine for GRDL workflow orchestration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Claude Code (Anthropic)"},
]
maintainers = [
    {name = "Steven Siebert"},
]
keywords = ["geoint", "image-processing", "workflow", "runtime", "execution-engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "grdl>=0.1.1",
    "pyyaml>=6.0",
    "requests>=2.25",
    "packaging>=21.0",
    "structlog>=23.0",
    "pydantic>=2.0",
    "psutil>=5.9",
    "jsonschema>=4.18",
]

[project.scripts]
grdl-rt = "grdl_rt.cli:main"
grdl-rt-ui = "grdl_rt.ui:main"

[project.gui-scripts]
grdl-rt-ui = "grdl_rt.ui:main"

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0",
    "torch>=2.0",
]
metrics = [
    "prometheus-client>=0.19",
]
tracing = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
detection = [
    "shapely>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-mypy>=1.0",
    "pytest-ruff>=0.5",
    "pytest-black>=0.6",
    "black>=26.1.0",
    "mypy>=0.950",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.25",
    "types-psutil>=5.9",
]

[project.urls]
Repository = "https://github.com/geoint-org/GRDL"

[tool.setuptools.packages.find]
include = ["grdl_rt*"]

[tool.pytest.ini_options]
testpaths = ["tests", "grdl_rt"]
addopts = "-v --mypy --ruff --black"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402"]

[tool.coverage.run]
omit = [
    "grdl_rt/ui/_app.py",
    "grdl_rt/ui/_config_dialog.py",
    "grdl_rt/ui/_metrics_panel.py",
    "grdl_rt/ui/_runner.py",
    "grdl_rt/ui/_widgets.py",
    "grdl_rt/ui/__main__.py",
    "grdl_rt/execution/gpu.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["annotation-unchecked", "import-untyped"]
